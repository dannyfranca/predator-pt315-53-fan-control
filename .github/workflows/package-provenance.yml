name: Package provenance

on:
  pull_request:
    paths:
      - ".github/workflows/package-provenance.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/fan-control-core/Cargo.toml"
      - "crates/fan-control-core/src/**"
      - "crates/fan-control-core/tests/package_provenance_verifier.rs"
      - "crates/fan-control-core/tests/source_lock_verifier.rs"
      - "crates/fan-control-core/tests/support/**"
      - "compatibility/pt315-53.toml"
      - "packaging/kernel/**"
      - "schemas/package-provenance-v1.json"
      - "scripts/verify-package-provenance"
      - "scripts/verify-source-lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-provenance.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/fan-control-core/Cargo.toml"
      - "crates/fan-control-core/src/**"
      - "crates/fan-control-core/tests/package_provenance_verifier.rs"
      - "crates/fan-control-core/tests/source_lock_verifier.rs"
      - "crates/fan-control-core/tests/support/**"
      - "compatibility/pt315-53.toml"
      - "packaging/kernel/**"
      - "schemas/package-provenance-v1.json"
      - "scripts/verify-package-provenance"
      - "scripts/verify-source-lock"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install provenance verification dependencies
        run: pacman -Syu --noconfirm git gnupg kmod libarchive openssl python rust sbsigntools systemd zstd
      - name: Exercise package, module, and real Secure Boot verification
        run: |
          cargo test -p fan-control-core --test package_provenance_verifier
          cargo test -p fan-control-core --test source_lock_verifier
