name: Package provenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install provenance verification dependencies
        run: pacman -Syu --noconfirm git gnupg kmod libarchive openssl python rust sbsigntools systemd zstd
      - name: Exercise package, module, and real Secure Boot verification
        run: |
          cargo test -p fan-control-core --test package_provenance_verifier
          cargo test -p fan-control-core --test source_lock_verifier
