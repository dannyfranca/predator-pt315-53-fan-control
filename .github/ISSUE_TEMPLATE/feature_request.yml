name: In-scope feature request
description: Propose a PT315-53 CachyOS safety or qualification improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request is specifically for the Acer Predator PT315-53 on CachyOS.
          required: true
        - label: It preserves the standard in-tree acer_wmi/Acer hwmon backend and fail-closed behavior.
          required: true
        - label: It is not a GUI, other-model, other-distribution, bypass-backend, or unrelated-tuning request.
          required: true
  - type: textarea
    id: model
    attributes:
      label: Exact-model evidence
      description: Redacted DMI product/board identity, BIOS, CachyOS/kernel identity, and relevant two-fan ABI or qualification evidence.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Safety or qualification problem
      description: What exact in-scope problem exists, and what evidence demonstrates it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the narrow change, fail-closed behavior, restoration impact, and tests.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Evidence handling
      options:
        - label: I redacted identifying data and kept complete qualification records private.
          required: true
