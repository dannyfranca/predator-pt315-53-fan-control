[package]
name = "fan-control-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
acceptance-fixture = []

[lib]
path = "src/lib.rs"

[dependencies]
libc = "0.2.177"
jsonschema = { version = "0.30.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
signal-hook = "0.3.18"
toml = "0.9.12"
tracing = "0.1.41"
tracing-subscriber = "0.3.23"

[dev-dependencies]
flate2 = "1.1.2"
jsonschema = { version = "0.30.0", default-features = false }
serde_yaml = "0.9.34"
tempfile = "3.23"
