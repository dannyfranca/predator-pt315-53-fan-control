[package]
name = "fan-control-qualify"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fan-control-core = { path = "../fan-control-core" }
fan-control-daemon = { path = "../fan-control-daemon" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
flate2 = "1"
jsonschema = { version = "0.30", default-features = false }
